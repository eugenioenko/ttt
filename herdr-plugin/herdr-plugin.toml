id = "ttt.editor"
name = "TTT Editor"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Terminal Text Tool — a full IDE in your terminal"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open TTT"
contexts = ["workspace"]
command = ["ttt", "."]

[[actions]]
id = "open-worktree"
title = "Open TTT in worktree"
contexts = ["workspace"]
command = ["sh", "scripts/open-worktree.sh"]

[[actions]]
id = "open-link"
title = "Open file link in TTT"
contexts = ["workspace"]
command = ["sh", "scripts/open-link.sh"]

[[panes]]
id = "editor"
title = "TTT Editor"
command = ["sh", "scripts/open-worktree.sh"]

[[link_handlers]]
id = "open-file"
title = "Open in TTT"
pattern = "^[A-Za-z0-9_./-]+\\.[a-zA-Z0-9]+(:[0-9]+(:[0-9]+)?)?$"
action = "open-link"
