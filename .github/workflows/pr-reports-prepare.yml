name: PR reports prepare

# Forks need a trusted write token to comment. Never check out or run PR code here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

    # Match the documentation-only exclusions in CI's classify job.
    paths-ignore:
      - "docs-web/**"
      - README.md
      - AGENTS.md
      - ARCHITECTURE.md
      - LICENSE
      - "audit/*.md"
      - "workflows/*.md"

permissions:
  pull-requests: write

concurrency:
  # Serialize with the publisher so a late placeholder cannot overwrite results.
  group: pr-reports-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Post or reset report comments
        run: |
          set -euo pipefail

          for report in benchmarks size; do
            if [[ "$report" == benchmarks ]]; then
              marker="<!-- ttt-editor-benchmarks -->"
              title="Performance benchmarks"
            else
              marker="<!-- ttt-binary-size -->"
              title="Binary size"
            fi

            current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.state == "open" and .base.ref == "main" and .head.sha == env.HEAD_SHA')"
            if [[ "$current" != true ]]; then
              exit 0
            fi

            ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and ((.body // \"\") | startswith(\"$marker\"))) | .id")"
            id="${ids%%$'\n'*}"
            if [[ -n "$id" ]]; then
              body="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq '.body')"
              if [[ "$body" == *"<!-- ttt-report-complete:$HEAD_SHA -->"* || "$body" == *"Report generated by PR code at \`${HEAD_SHA:0:12}\`."* ]]; then
                continue
              fi
            fi

            {
              echo "$marker"
              echo "<!-- ttt-report-pending:$HEAD_SHA -->"
              echo "## $title"
              echo
              echo "Waiting for results for \`${HEAD_SHA:0:12}\`. This comment updates when CI finishes."
              echo
              echo "[View CI checks](https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER/checks)."
            } > "$RUNNER_TEMP/report-comment.md"

            if [[ -n "$id" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/report-comment.md" >/dev/null
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/report-comment.md" >/dev/null
            fi
          done
