name: Auto-update Flake Hash

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a PR
      pull-requests: write # Required to create a PR

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v25

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test vendorHash updater
        run: go test ./scripts -run TestUpdateFlakeHash -count=1

      - name: Update vendorHash
        id: update_hash
        run: bash scripts/update-flake-hash.sh

      - name: Create Pull Request
        if: steps.update_hash.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update vendorHash in flake.nix"
          title: "chore: update vendorHash"
          branch: "auto-update-vendorhash"
          delete-branch: true
          reviewers: ""
