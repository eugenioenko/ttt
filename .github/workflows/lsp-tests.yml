name: LSP Tests

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language server to test"
        type: choice
        default: all
        options:
          - all
          - c
          - go
          - typescript
  workflow_call:
    inputs:
      language:
        description: "Language server to test (all, c, go, typescript)"
        type: string
        default: all
    outputs:
      test_outcome:
        description: "LSP test step outcome"
        value: ${{ jobs.lsp-tests.outputs.test_outcome }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  GOPLS_VERSION: "v0.21.1"
  CLANGD_VERSION: "18"
  PNPM_VERSION: "11"
  TYPESCRIPT_VERSION: "5.9.3"
  TYPESCRIPT_LANGUAGE_SERVER_VERSION: "6.0.0"

jobs:
  lsp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test_outcome: ${{ steps.lsp.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: make build

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: tests/integration/pnpm-lock.yaml

      - name: Install LSP servers
        run: |
          go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"
          npm install -g "typescript@${TYPESCRIPT_VERSION}" "typescript-language-server@${TYPESCRIPT_LANGUAGE_SERVER_VERSION}"
          sudo apt-get update
          sudo apt-get install -y "clangd-${CLANGD_VERSION}"
          sudo ln -sf "/usr/bin/clangd-${CLANGD_VERSION}" /usr/local/bin/clangd

      - name: Provide typescript to the TS fixture workspace
        run: npm install --prefix tests/integration/lsp/typescript --no-save "typescript@${TYPESCRIPT_VERSION}"

      - name: Install test dependencies
        working-directory: tests/integration
        run: pnpm install --frozen-lockfile

      - name: Run LSP tests
        id: lsp
        working-directory: tests/integration
        env:
          LSP_LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LSP_LANGUAGE" in
            all) pnpm exec vitest run --reporter=verbose lsp-compatibility.test.js ;;
            c|go|typescript)
              pnpm exec vitest run --reporter=verbose lsp-compatibility.test.js --testNamePattern=" $LSP_LANGUAGE "
              ;;
            *) echo "::error::Unsupported language: $LSP_LANGUAGE"; exit 1 ;;
          esac
