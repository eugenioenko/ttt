name: Update Contributors

on:
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update contributor lists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make contributors

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: auto-update-contributors
          delete-branch: true
          add-paths: internal/app/contributors.json
          commit-message: "chore(about): update contributors and issue reporters"
          title: "chore(about): update contributors and issue reporters"
          body: |
            Refreshes the About dialog's contributor and issue reporter lists using `make contributors`.

            Generated by the manually triggered **Update Contributors** workflow.
